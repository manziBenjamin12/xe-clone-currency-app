<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients | Rural Care Clinic</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #d9e3e8; }
        .app { max-width: 1400px; margin: 0 auto; background: #f4f7fc; min-height: 100vh; }
        .header { background: #1e3a4d; padding: 1.2rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo h1 { color: white; font-size: 1.5rem; }
        .logo p { color: #a8c8d8; font-size: 0.75rem; }
        .offline-badge { background: #c44536; color: white; padding: 0.5rem 1.2rem; border-radius: 50px; font-size: 0.8rem; }
        .nav-menu { background: white; padding: 0 1.5rem; display: flex; flex-wrap: wrap; gap: 0.2rem; border-bottom: 1px solid #e2edf2; }
        .nav-menu a { padding: 1rem 1.3rem; text-decoration: none; color: #1f4b5c; font-weight: 600; border-bottom: 3px solid transparent; }
        .nav-menu a.active { color: #2c9b77; border-bottom-color: #2c9b77; }
        .nav-menu a:hover { background: #eaf4f8; }
        .container { padding: 2rem; }
        .card { background: white; border-radius: 28px; padding: 1.5rem; box-shadow: 0 5px 18px rgba(0,0,0,0.05); }
        .card h2 { color: #154e63; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid #e7f0f4; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.8rem; text-align: left; border-bottom: 1px solid #ecf3f7; }
        th { background: #f2f8fc; }
        .btn { padding: 0.5rem 1rem; border-radius: 20px; border: none; cursor: pointer; background: #ecf3f7; }
        .btn-small { background: #2c9b77; color: white; }
        .status-badge { background: #c9e9de; padding: 0.2rem 0.8rem; border-radius: 20px; font-size: 0.75rem; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #1e3a4d; color: white; padding: 12px 24px; border-radius: 40px; display: none; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="logo"><h1>🏥 Rural Care Clinic Centre</h1><p>Digital Patient Check-in System (offline)</p></div>
        <div class="offline-badge">⚠️ You are working OFFLINE</div>
    </div>
    <div class="nav-menu">
        <a href="index.html">📊 Dashboard</a>
        <a href="checkin.html">📝 Check-in</a>
        <a href="patients.html" class="active">👥 Patients</a>
        <a href="appointments.html">📅 Appointments</a>
        <a href="reports.html">📈 Reports</a>
        <a href="settings.html">⚙️ Settings</a>
        <a href="backup.html">💾 BackUp Data</a>
        <a href="about.html">ℹ️ About</a>
    </div>
    <div class="container">
        <div class="card">
            <h2>👥 All Registered Patients</h2>
            <div id="patientsList">Loading...</div>
        </div>
    </div>
</div>
<div id="toast" class="toast"></div>

<script>
    const STORAGE_KEY = 'rural_clinic_data';
    let patients = [];

    function loadData() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if(stored) patients = JSON.parse(stored);
        else patients = [];
    }

    function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(patients)); }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 2500);
    }

    function renderPatients() {
        if(patients.length === 0) {
            document.getElementById('patientsList').innerHTML = '<em>No patients registered. Go to Check-in page.</em>';
            return;
        }
        let html = `<table><tr><th>Name</th><th>Age/Gender</th><th>Phone</th><th>Status</th><th>Checked-in</th><th>Action</th></tr>`;
        patients.forEach(p => {
            html += `<tr>
                <td>${p.name}</td>
                <td>${p.age || '?'}/${p.gender || '—'}</td>
                <td>${p.phone || '—'}</td>
                <td><span class="status-badge">${p.status}</span></td>
                <td>${p.checkedIn ? '✅ Yes' : '❌ No'}</td>
                <td><button class="btn" onclick="toggleCheckin('${p.id}')">${p.checkedIn ? 'Remove from cue' : 'Check-in'}</button></td>
            </tr>`;
        });
        html += `</table>`;
        document.getElementById('patientsList').innerHTML = html;
    }

    window.toggleCheckin = function(id) {
        const patient = patients.find(p => p.id === id);
        if(patient) {
            patient.checkedIn = !patient.checkedIn;
            if(patient.checkedIn) patient.checkinTime = new Date().toLocaleString();
            else patient.checkinTime = null;
            saveData();
            renderPatients();
            showToast(`${patient.name} updated`);
        }
    };

    loadData();
    renderPatients();
</script>
</body>
</html>
