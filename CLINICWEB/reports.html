<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | Rural Care Clinic</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #d9e3e8; }
        .app { max-width: 1400px; margin: 0 auto; background: #f4f7fc; min-height: 100vh; }
        .header { background: #1e3a4d; padding: 1.2rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo h1 { color: white; font-size: 1.5rem; }
        .logo p { color: #a8c8d8; font-size: 0.75rem; }
        .offline-badge { background: #c44536; color: white; padding: 0.5rem 1.2rem; border-radius: 50px; font-size: 0.8rem; }
        .nav-menu { background: white; padding: 0 1.5rem; display: flex; flex-wrap: wrap; gap: 0.2rem; border-bottom: 1px solid #e2edf2; }
        .nav-menu a { padding: 1rem 1.3rem; text-decoration: none; color: #1f4b5c; font-weight: 600; border-bottom: 3px solid transparent; }
        .nav-menu a.active { color: #2c9b77; border-bottom-color: #2c9b77; }
        .nav-menu a:hover { background: #eaf4f8; }
        .container { padding: 2rem; }
        .card { background: white; border-radius: 28px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 5px 18px rgba(0,0,0,0.05); }
        .card h2 { color: #154e63; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid #e7f0f4; }
        .stats-grid { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
        .stat-box { background: #f8fbfd; flex: 1; min-width: 150px; padding: 1.5rem; text-align: center; border-radius: 20px; border: 1px solid #e6edf2; }
        .stat-number { font-size: 2rem; font-weight: 700; color: #2c9b77; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="logo"><h1>🏥 Rural Care Clinic Centre</h1><p>Digital Patient Check-in System (offline)</p></div>
        <div class="offline-badge">⚠️ You are working OFFLINE</div>
    </div>
    <div class="nav-menu">
        <a href="index.html">📊 Dashboard</a>
        <a href="checkin.html">📝 Check-in</a>
        <a href="patients.html">👥 Patients</a>
        <a href="appointments.html">📅 Appointments</a>
        <a href="reports.html" class="active">📈 Reports</a>
        <a href="settings.html">⚙️ Settings</a>
        <a href="backup.html">💾 BackUp Data</a>
        <a href="about.html">ℹ️ About</a>
    </div>
    <div class="container">
        <div class="card">
            <h2>📊 Clinic Reports & Analytics</h2>
            <div class="stats-grid" id="reportStats"></div>
        </div>
        <div class="card">
            <h2>📋 Detailed Summary</h2>
            <div id="detailedReport"></div>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'rural_clinic_data';
    let patients = [];

    function loadData() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if(stored) patients = JSON.parse(stored);
        else patients = [];
    }

    function renderReports() {
        const total = patients.length;
        const checkedIn = patients.filter(p => p.checkedIn).length;
        const returning = patients.filter(p => p.status === 'Returning').length;
        const newPatients = patients.filter(p => p.status === 'NEW').length;
        const male = patients.filter(p => p.gender === 'Male').length;
        const female = patients.filter(p => p.gender === 'Female').length;
        
        document.getElementById('reportStats').innerHTML = `
            <div class="stat-box"><div class="stat-number">${total}</div><div>Total Patients</div></div>
            <div class="stat-box"><div class="stat-number">${checkedIn}</div><div>Currently Checked-in</div></div>
            <div class="stat-box"><div class="stat-number">${returning}</div><div>Returning Patients</div></div>
            <div class="stat-box"><div class="stat-number">${newPatients}</div><div>New Patients</div></div>
        `;
        
        document.getElementById('detailedReport').innerHTML = `
            <p><strong>Gender Breakdown:</strong> Male: ${male} | Female: ${female} | Other: ${patients.length - male - female}</p>
            <p><strong>Data Storage:</strong> All data is stored locally on this device using localStorage.</p>
            <p><strong>Last Updated:</strong> ${new Date().toLocaleString()}</p>
            <p><strong>Offline Status:</strong> ✅ Working completely offline - no internet required</p>
        `;
    }

    loadData();
    renderReports();
</script>
</body>
</html>
