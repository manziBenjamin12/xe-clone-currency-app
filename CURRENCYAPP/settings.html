<!DOCTYPE html>
<html>
<head>
    
    <title>Settings</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
     <div class="logo">
        <img src="assets/Logo.png" control width="75" height="75">
        </div>
        <div class="tittle">
        <h3>CURRENCY EXCHANGE WEBSITE</h3>
        </div>
        
        <nav>
            <button><a href="index.html">Home</a></button>
            <button><a href="converter.html">Full Converter</a></button>
            <button><a href="history.html">History</a></button>
        
        </nav>
</header>

<div class="settings-container">

    <div class="card">
        <h3>Theme</h3><br>
        <button onclick="toggleTheme()">🌙 Toggle Dark / Light</button><br>
    </div>
    
    <div class="card">
        <h3>Default Currency</h3><br>

        <select id="defaultCurrency">
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
            <option value="RWF">RWF</option>
            <option value="KES">KES</option>
        </select>

        <button onclick="saveCurrency()">Save</button><br>
    </div>

    <div class="card">
        <h3>Language</h3><br>

        <select id="language">
            <option value="EN">English</option>
            <option value="RW">Kinyarwanda</option>
            <option value="FR">French</option>
        </select>

        <button onclick="saveLanguage()">Save</button><br>
    </div>

</div>
